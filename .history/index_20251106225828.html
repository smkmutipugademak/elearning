<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Mapel Produktif</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/a2b5b6f9b4.js" crossorigin="anonymous"></script>
</head>

<body>
    <!-- HEADER -->
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <h1>LMS Produktif</h1>
        </div>
        <nav>
            <input type="search" id="search" placeholder="Cari mata pelajaran..." />
            <button class="btn-profile"><i class="fa-solid fa-user"></i></button>
        </nav>
    </header>

    <!-- SIDEBAR + DASHBOARD -->
    <div class="container">
        <aside class="sidebar">
            <h3>Kelas</h3>
            <button class="kelas-btn active" data-grade="X">Kelas X</button>
            <button class="kelas-btn" data-grade="XI">Kelas XI</button>
            <button class="kelas-btn" data-grade="XII">Kelas XII</button>

            <hr>
            <h3>Menu</h3>
            <ul>
                <li><i class="fa-solid fa-book"></i> Materi</li>
                <li><i class="fa-solid fa-wrench"></i> Praktikum</li>
                <li><i class="fa-solid fa-pencil"></i> Latihan Soal</li>
                <li><i class="fa-solid fa-brain"></i> Try Out</li>
            </ul>
        </aside>

        <main class="dashboard">
            <section class="welcome">
                <h2>Selamat Datang di LMS Mapel Produktif 👋</h2>
                <p>Pilih kelas dan mata pelajaran untuk mulai belajar.</p>
            </section>

            <section class="mapel-section">
                <h3>Mata Pelajaran</h3>
                <div class="mapel-grid" id="mapelContainer">
                    <!-- Kartu Mapel -->
                </div>
            </section>
        </main>
    </div>

    <footer>
        © 2025 LMS Produktif — Made for Vocational Learning
    </footer>

    <script src="script.js"></script>
</body>

</html>
