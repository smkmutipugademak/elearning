<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan Soal | LMS Produktif</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>

<body>
    <header class="navbar">
        <div class="logo">📘 Latihan Soal</div>
        <div id="timer" class="timer">⏱️ 00:00</div>
        <div class="navbar-right">
            <button id="darkModeToggle" class="btn-darkmode">🌙</button>
            <a href="index.html" class="btn-back">← Dashboard</a>
        </div>
    </header>

    <main class="content">
        <section class="quiz-container">
            <h2>Latihan Pilihan Ganda - Coding Bab 1</h2>

            <div id="quiz"></div>

            <button id="submitQuiz" disabled>Kirim Jawaban</button>

            <div id="result"></div>
            <div id="hasilPembahasan" style="display:none;"></div>

            <button id="ulangQuiz" style="display:none;">🔁 Ulangi Latihan</button>
        </section>
    </main>

    <script>
        // === DARK MODE TOGGLE ===
        const toggle = document.getElementById('darkModeToggle');
        const body = document.body;

        // Cek preferensi tersimpan
        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark-mode');
            toggle.textContent = '☀️';
        }

        toggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            toggle.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
    </script>

    <script src="script.js"></script>
</body>

</html>
